[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ingestwitness"
version = "0.1.0"
description = "Post-ingestion semantic coverage review for PDF-to-RAG chunks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pypdf>=5,<7", "sentence-transformers>=5,<6", "socksio>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
ingestwitness = "ingestwitness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestwitness"]
